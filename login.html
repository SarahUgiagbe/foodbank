<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — We Share & Care Food Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/shared.css">
    <link rel="stylesheet" href="/static/login.css">
</head>
<body class="login-page">

    <!-- LOGIN CONTAINER -->
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Logo / Brand -->
            <div class="login-brand text-center">
                <div class="brand-icon">
                    <i class="bi bi-heart-fill"></i>
                </div>
                <h2 class="brand-title font-serif">We Share & Care</h2>
                <p class="brand-subtitle">Food Bank</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-envelope text-muted"></i>
                        </span>
                        <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0" id="loginPassword" placeholder="Enter your password" required>
                        <button class="btn btn-toggle-password" type="button" onclick="togglePassword()">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link" onclick="showForgotPassword()">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <!-- Role Info -->
            <div class="login-roles text-center mt-4">
                <p class="roles-text">
                    <i class="bi bi-info-circle me-1"></i>
                    Sign in as <strong>Volunteer</strong> or <strong>Manager</strong>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="login-footer text-center">
            <p class="mb-0">We Share & Care Food Bank</p>
            <small>Thank you for your dedication to our community</small>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast toast-custom" role="alert">
            <div class="toast-header toast-header-custom">
                <strong class="me-auto">We Share & Care Food Bank</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/shared.js"></script>
    <script src="/static/login.js"></script>
</body>
</html>
<script>
    //Put ALL users here or use Python to search in the database?
    const users = [
  {
    user_id: '{{profile_data[1].user_id}}',
    email: '{{profile_data[1].email}}', 
    password: '{{profile_data[1].password}}',
    role: '{{profile_data[1].role}}',
    name: '{{profile_data[1].full_name}}',
    redirect: 'scheduler.html'
  },
  {
    user_id: '{{profile_data[2].user_id}}',
    email: '{{profile_data[2].email}}',
    password: '{{profile_data[2].password}}',
    role: '{{profile_data[2].role}}',
    name: '{{profile_data[2].full_name}}',
    redirect: 'scheduler.html'
  },
  {
    user_id: '{{profile_data[3].user_id}}',
    email: '{{profile_data[3].email}}', 
    password: '{{profile_data[3].password}}',
    role: '{{profile_data[3].role}}',
    name: '{{profile_data[3].full_name}}',
    redirect: 'scheduler.html'
  },
  {
    user_id: '{{profile_data[4].user_id}}',
    email: '{{profile_data[4].email}}', 
    password: '{{profile_data[4].password}}',
    role: '{{profile_data[4].role}}',
    name: '{{profile_data[4].full_name}}',
    redirect: 'scheduler.html'
  },
  {
    user_id: '{{profile_data[5].user_id}}',
    email: '{{profile_data[5].email}}', 
    password: '{{profile_data[5].password}}',
    role: '{{profile_data[5].role}}',
    name: '{{profile_data[5].full_name}}',
    redirect: 'scheduler.html'
  },
];

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('loginForm').addEventListener('submit', handleLogin);
});

function handleLogin(e) {
  e.preventDefault();
  
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const rememberMe = document.getElementById('rememberMe').checked;
  
  if (!email || !password) {
    showToast('Please enter both email and password.');
    return;
  }
  
  // Find user
  const user = users.find(u => u.email === email && u.password === password);
  
  if (!user) {
    showToast('Invalid email or password. Please try again.');
    return;
  }
  
  // Store login info
  const loginData = {
    email: user.email,
    name: user.name,
    role: user.role,
    timestamp: new Date().toISOString()
  };
  
  if (rememberMe) {
    localStorage.setItem('wsc_user', JSON.stringify(loginData));
  } else {
    sessionStorage.setItem('wsc_user', JSON.stringify(loginData));
  }

  // Send the matched user's ID number straight to Python
  fetch('/set-active-user', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: parseInt(user.user_id) })
  });
  
  showToast(`Welcome back, ${user.name}! Redirecting...`);
  
  // Redirect after short delay
  setTimeout(() => {
    window.location.href = user.redirect;
  }, 1500);
}

function togglePassword() {
  const passwordInput = document.getElementById('loginPassword');
  const toggleIcon = document.getElementById('toggleIcon');
  
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    toggleIcon.className = 'bi bi-eye-slash';
  } else {
    passwordInput.type = 'password';
    toggleIcon.className = 'bi bi-eye';
  }
}

function showForgotPassword() {
  showToast('Please contact the General Manager to reset your password.');
}
</script>
</body>
</html>
